---
west:
  system:
    driver: westpa.core.systems.WESTSystem
    system_options:
      pcoord_ndim: 1
      pcoord_len: 2
      pcoord_dtype: !!python/name:numpy.float32
      bins:
        type: RectilinearBinMapper
        boundaries:
          - [0.0, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 3.0, 'inf']
      bin_target_counts: 4
  propagation:
    max_total_iterations: 20
    max_run_wallclock: 02:00:00
    propagator: executable
    gen_istates: false
  data:
    west_data_file: $WORK_DIR/west.h5
    datasets:
      - name: pcoord
        scaleoffset: 4
    data_refs:
      segment: $WORK_DIR/traj_segs/{segment.n_iter:06d}/{segment.seg_id:06d}
      basis_state: $WORK_DIR/bstates/{basis_state.auxref}
      initial_state: $WORK_DIR/istates/{initial_state.iter_created}/{initial_state.state_id}
  executable:
    environ: {}
    propagator:
      executable: $WEST_SIM_ROOT/westpa_scripts/runseg.sh
      stdout: $WORK_DIR/seg_logs/{segment.n_iter:06d}-{segment.seg_id:06d}.log
      stderr: stdout
    get_pcoord:
      executable: $WEST_SIM_ROOT/westpa_scripts/get_pcoord.sh
      stdout: $WEST_SIM_ROOT/get_pcoord.log
      stderr: stdout
