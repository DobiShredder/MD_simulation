<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>ABFE decoupling stages for JZ4</title>
  <desc>Ball-and-stick schematic of electrostatic and Lennard-Jones decoupling for every atom of neutral 2-propylphenol JZ4.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10 L10 0" stroke="#6B7280" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">ABFE decoupling of :JZ4</text>
  <text x="60" y="86" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280">Neutral ligand: partial charges are removed before Lennard-Jones interactions</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(45 150)">
      <rect width="310" height="325" rx="16" fill="#F8FBFD" stroke="#B8C4CE" stroke-width="2"/>
      <text x="155" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#243447">Interacting JZ4</text>
      <g stroke="#CC79A7" stroke-width="6" fill="none">
        <path d="M95 115 L150 85 L205 115 L205 180 L150 210 L95 180 Z"/>
        <path d="M205 180 L240 215 L265 260"/>
        <path d="M150 85 L150 55"/>
      </g>
      <g fill="#CC79A7" stroke="#FFFFFF" stroke-width="3">
        <circle cx="95" cy="115" r="14"/><circle cx="150" cy="85" r="14"/>
        <circle cx="205" cy="115" r="14"/><circle cx="205" cy="180" r="14"/>
        <circle cx="150" cy="210" r="14"/><circle cx="95" cy="180" r="14"/>
        <circle cx="240" cy="215" r="14"/><circle cx="265" cy="260" r="14"/>
      </g>
      <circle cx="150" cy="50" r="16" fill="#0072B2" stroke="#FFFFFF" stroke-width="3"/>
      <text x="150" y="56" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">O</text>
      <text x="155" y="305" text-anchor="middle" font-size="17" fill="#D55E00">partial charges + LJ</text>
    </g>

    <g transform="translate(445 150)">
      <rect width="310" height="325" rx="16" fill="#F8FBFD" stroke="#B8C4CE" stroke-width="2"/>
      <text x="155" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#243447">Charge removed</text>
      <g stroke="#6B7280" stroke-width="6" fill="none">
        <path d="M95 115 L150 85 L205 115 L205 180 L150 210 L95 180 Z"/>
        <path d="M205 180 L240 215 L265 260"/>
        <path d="M150 85 L150 55"/>
      </g>
      <g fill="#6B7280" stroke="#FFFFFF" stroke-width="3">
        <circle cx="95" cy="115" r="14"/><circle cx="150" cy="85" r="14"/>
        <circle cx="205" cy="115" r="14"/><circle cx="205" cy="180" r="14"/>
        <circle cx="150" cy="210" r="14"/><circle cx="95" cy="180" r="14"/>
        <circle cx="240" cy="215" r="14"/><circle cx="265" cy="260" r="14"/>
        <circle cx="150" cy="50" r="16"/>
      </g>
      <text x="155" y="305" text-anchor="middle" font-size="17" font-weight="bold" fill="#0072B2">crgmask=':JZ4'</text>
    </g>

    <g transform="translate(845 150)">
      <rect width="310" height="325" rx="16" fill="#F8FBFD" stroke="#B8C4CE" stroke-width="2"/>
      <g opacity="0.28">
        <g stroke="#6B7280" stroke-width="6" fill="none">
          <path d="M95 115 L150 85 L205 115 L205 180 L150 210 L95 180 Z"/>
          <path d="M205 180 L240 215 L265 260"/><path d="M150 85 L150 55"/>
        </g>
        <g fill="#6B7280">
          <circle cx="95" cy="115" r="14"/><circle cx="150" cy="85" r="14"/>
          <circle cx="205" cy="115" r="14"/><circle cx="205" cy="180" r="14"/>
          <circle cx="150" cy="210" r="14"/><circle cx="95" cy="180" r="14"/>
          <circle cx="240" cy="215" r="14"/><circle cx="265" cy="260" r="14"/>
          <circle cx="150" cy="50" r="16"/>
        </g>
      </g>
      <text x="155" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#243447">LJ removed</text>
      <ellipse cx="155" cy="160" rx="135" ry="120" fill="url(#hatch)" stroke="#6B7280" stroke-width="3" opacity="0.45"/>
      <text x="155" y="305" text-anchor="middle" font-size="17" font-weight="bold" fill="#6B7280">scmask1=':JZ4'</text>
    </g>

    <line x1="365" y1="315" x2="430" y2="315" stroke="#243447" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="398" y="288" text-anchor="middle" font-size="16" fill="#0072B2">electrostatics off</text>
    <line x1="765" y1="315" x2="830" y2="315" stroke="#243447" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="798" y="288" text-anchor="middle" font-size="16" fill="#6B7280">LJ off</text>

    <rect x="170" y="535" width="860" height="80" rx="14" fill="#F4ECFA" stroke="#CC79A7" stroke-width="2"/>
    <text x="600" y="570" text-anchor="middle" font-size="18" fill="#243447">Protein, water and Boresch reference atoms remain interacting.</text>
    <text x="600" y="600" text-anchor="middle" font-size="16" fill="#6B7280">The ligand net charge is zero, but its atom-centered partial charges are decoupled.</text>
  </g>
</svg>
