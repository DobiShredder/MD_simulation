<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>OPES METAD estimates a probability distribution before calculating bias</title>
<desc>A four-step schematic shows visited collective-variable samples, kernel-density estimation of the unbiased distribution, selection of a well-tempered target distribution, and calculation of the bias that drives the next sampling cycle.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#7A5195"/>
  </marker>
</defs>

<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="55" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">OPES_METAD: estimate first, then calculate bias</text>
<text x="55" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280">Schematic 1D view of the φ/ψ workflow — sampled data update an estimate of P(s)</text>

<!-- Step arrows -->
<line x1="292" y1="310" x2="325" y2="310" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="577" y1="310" x2="610" y2="310" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="862" y1="310" x2="895" y2="310" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Step 1 -->
<rect x="45" y="125" width="245" height="390" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="78" cy="162" r="19" fill="#243447"/>
<text x="78" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
<text x="108" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Collect samples</text>
<text x="70" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">visited CV positions s(t)</text>
<line x1="70" y1="420" x2="265" y2="420" stroke="#243447" stroke-width="2"/>
<text x="168" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243447">collective variable s</text>
<circle cx="89" cy="393" r="6" fill="#0072B2"/>
<circle cx="103" cy="378" r="6" fill="#0072B2"/>
<circle cx="116" cy="399" r="6" fill="#0072B2"/>
<circle cx="128" cy="369" r="6" fill="#0072B2"/>
<circle cx="141" cy="387" r="6" fill="#0072B2"/>
<circle cx="154" cy="359" r="6" fill="#0072B2"/>
<circle cx="169" cy="383" r="6" fill="#0072B2"/>
<circle cx="181" cy="396" r="6" fill="#0072B2"/>
<circle cx="206" cy="350" r="6" fill="#0072B2"/>
<circle cx="219" cy="371" r="6" fill="#0072B2"/>
<circle cx="233" cy="361" r="6" fill="#0072B2"/>
<circle cx="247" cy="389" r="6" fill="#0072B2"/>
<path d="M82 305 C110 275 130 340 158 300 C185 260 212 320 250 274" fill="none" stroke="#0072B2" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>
<text x="168" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2">sampling history</text>

<!-- Step 2 -->
<rect x="330" y="125" width="245" height="390" rx="16" fill="#FFF9ED" stroke="#E9B44C" stroke-width="2"/>
<circle cx="363" cy="162" r="19" fill="#D55E00"/>
<text x="363" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
<text x="393" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Estimate P<tspan baseline-shift="sub" font-size="14">n</tspan>(s)</text>
<text x="355" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">reweighting + kernel density</text>
<line x1="355" y1="420" x2="550" y2="420" stroke="#243447" stroke-width="2"/>
<line x1="355" y1="420" x2="355" y2="245" stroke="#243447" stroke-width="2"/>
<path d="M362 416 C378 414 383 351 405 347 C427 343 429 405 446 407 C462 408 469 285 493 280 C517 276 527 392 548 408" fill="none" stroke="#D55E00" stroke-width="5"/>
<path d="M370 416 C380 410 386 365 405 365 C424 365 430 409 440 416" fill="none" stroke="#E69F00" stroke-width="2.5" opacity="0.65"/>
<path d="M457 416 C470 405 474 304 493 304 C512 304 526 405 540 416" fill="none" stroke="#E69F00" stroke-width="2.5" opacity="0.65"/>
<text x="452" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243447">estimated P<tspan baseline-shift="sub" font-size="11">n</tspan>(s)</text>
<rect x="361" y="468" width="183" height="28" rx="8" fill="#FCE8D5"/>
<text x="452" y="487" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#D55E00">compressed kernels</text>

<!-- Step 3 -->
<rect x="615" y="125" width="245" height="390" rx="16" fill="#F1F8FC" stroke="#56B4E9" stroke-width="2"/>
<circle cx="648" cy="162" r="19" fill="#0072B2"/>
<text x="648" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
<text x="678" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Define target</text>
<text x="640" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">well-tempered p<tspan baseline-shift="super" font-size="12">target</tspan>(s)</text>
<line x1="640" y1="420" x2="835" y2="420" stroke="#243447" stroke-width="2"/>
<line x1="640" y1="420" x2="640" y2="245" stroke="#243447" stroke-width="2"/>
<path d="M646 410 C665 390 675 323 704 320 C730 317 735 379 752 382 C770 386 780 310 807 308 C823 307 829 375 834 405" fill="none" stroke="#0072B2" stroke-width="5" stroke-dasharray="10 7"/>
<path d="M650 410 C675 380 690 355 715 353 C747 350 765 353 790 350 C815 347 823 380 833 407" fill="none" stroke="#56B4E9" stroke-width="4"/>
<text x="737" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243447">desired sampled distribution</text>
<text x="737" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2">p<tspan baseline-shift="super" font-size="11">WT</tspan>(s) ∝ P<tspan baseline-shift="sub" font-size="11">n</tspan>(s)<tspan baseline-shift="super" font-size="11">1/γ</tspan></text>

<!-- Step 4 -->
<rect x="900" y="125" width="255" height="390" rx="16" fill="#F8F3FA" stroke="#B58BC4" stroke-width="2"/>
<circle cx="933" cy="162" r="19" fill="#7A5195"/>
<text x="933" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4</text>
<text x="963" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Calculate bias</text>
<text x="925" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">from estimate and target</text>
<line x1="925" y1="420" x2="1130" y2="420" stroke="#243447" stroke-width="2"/>
<line x1="925" y1="420" x2="925" y2="245" stroke="#243447" stroke-width="2"/>
<path d="M932 405 C950 390 958 305 980 300 C1000 295 1008 392 1025 394 C1043 397 1050 280 1075 275 C1100 270 1115 375 1125 405" fill="none" stroke="#7A5195" stroke-width="5"/>
<text x="1028" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243447">V<tspan baseline-shift="sub" font-size="11">n</tspan>(s)</text>
<rect x="937" y="468" width="181" height="28" rx="8" fill="#EBDDF0"/>
<text x="1028" y="487" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7A5195">apply to next MD steps</text>

<!-- Feedback loop: the calculated bias changes the next sampling cycle -->
<path d="M1028 525 L1028 565 L168 565 L168 525" fill="none" stroke="#7A5195" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text x="598" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#7A5195">calculated bias → next sampling cycle</text>

<text x="600" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">MetaD deposits bias directly; OPES estimates P<tspan baseline-shift="sub" font-size="11">n</tspan>(s) before calculating bias.</text>
</svg>
