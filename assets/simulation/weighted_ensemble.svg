<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Weighted ensemble propagation and resampling</title>
<desc>Core weighted-ensemble cycle showing walkers propagating into bins, then splitting and merging while total probability weight is conserved.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker>
<marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#6B7280" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="60" y="52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">Weighted ensemble</text>
<text x="60" y="88" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">Propagate first, then resample within progress-coordinate bins</text>
<line x1="90" y1="160" x2="90" y2="535" stroke="#C9D3DC" stroke-width="2"/>
<line x1="310" y1="160" x2="310" y2="535" stroke="#C9D3DC" stroke-width="2"/>
<line x1="530" y1="160" x2="530" y2="535" stroke="#C9D3DC" stroke-width="2"/>
<line x1="750" y1="160" x2="750" y2="535" stroke="#C9D3DC" stroke-width="2"/>
<line x1="970" y1="160" x2="970" y2="535" stroke="#C9D3DC" stroke-width="2"/>
<line x1="1130" y1="160" x2="1130" y2="535" stroke="#C9D3DC" stroke-width="2"/>
<text x="200.0" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">bin 1</text>
<text x="420.0" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">bin 2</text>
<text x="640.0" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">bin 3</text>
<text x="860.0" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">bin 4</text>
<text x="1050.0" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">bin 5</text>
<circle cx="150" cy="225" r="22" fill="#0072B2" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="150" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.4</text>
<path d="M170 225 C210 200 240 255 275 230" stroke="#0072B2" stroke-width="3" fill="none" opacity="1" marker-end="url(#arrow)"/>
<circle cx="380" cy="225" r="22" fill="#E69F00" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="380" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.2</text>
