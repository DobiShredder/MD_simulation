<text x="610" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.1</text>
<path d="M630 225 C670 200 700 255 735 230" stroke="#009E73" stroke-width="3" fill="none" opacity="1" marker-end="url(#arrow)"/>
<circle cx="835" cy="205" r="22" fill="#CC79A7" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="835" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.05</text>
<path d="M855 205 C895 180 925 235 960 210" stroke="#CC79A7" stroke-width="3" fill="none" opacity="1" marker-end="url(#arrow)"/>
