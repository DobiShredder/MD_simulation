<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img">
  <title>Weighted ensemble: sample rare conformations without changing probability weights</title>
  <desc>Schematic after an unbiased MD interval. The frequently visited folded region contains walkers A, B, and C, with weights 0.60, 0.20, and 0.10. The rarely visited more-open region contains only D, with weight 0.10. The resampler leaves A unchanged, selects the explicitly outlined pair B and C for merging, and splits D. This illustration selects B as the surviving parent, with probability 0.20 divided by 0.30, or two thirds. C's trajectory ends, and B retains its restart with combined weight 0.30. Two children of D share D's restart and each receive weight 0.05. Each bin now has two walkers, while bin probabilities remain 0.90 and 0.10 and total weight remains one. Protein sketches are illustrative and not actual Chignolin structures. Positions within bins do not encode exact progress coordinates, and resampling does not advance physical time. Target recycling is omitted.</desc>
  <defs>
    <marker id="we-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748B"/>
    </marker>
    <marker id="we-blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0072B2"/>
    </marker>
    <marker id="we-orange-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#B45309"/>
    </marker>
    <!-- Repeated backbone cartoons identify a retained parent or a copied restart. -->
    <g id="we-folded-a" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-33 -18 L-15 -31 L8 -26 L31 -10 L25 13 L3 26 L-22 18 L-27 -2 L-7 -9 L9 5"/>
    </g>
    <g id="we-folded-b" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-34 -8 L-19 -30 L5 -24 L28 -9 L27 15 L5 26 L-20 16 L-23 -4 L-3 -10 L10 7"/>
    </g>
    <g id="we-folded-c" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-30 -22 L-8 -28 L17 -15 L31 3 L14 24 L-10 23 L-28 8 L-15 -9 L3 -3 L8 12"/>
    </g>
    <g id="we-open-d" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-47 0 L-36 -17 L-21 -8 L-11 13 L3 23 L16 5 L20 -19 L34 -25 L47 -8"/>
    </g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243447; }
      .title { font-size: 35px; font-weight: 700; }
      .region { font-size: 28px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 22px; }
      .note { font-size: 21px; fill: #526174; }
      .identity { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .weight { font-size: 23px; font-weight: 700; text-anchor: middle; }
      .flow { fill: none; stroke: #64748B; stroke-width: 3; marker-end: url(#we-arrow); }
      .merge { fill: none; stroke: #0072B2; stroke-width: 3; marker-end: url(#we-blue-arrow); }
      .split { fill: none; stroke: #B45309; stroke-width: 3; marker-end: url(#we-orange-arrow); }
    </style>
  </defs>

  <rect width="1200" height="920" fill="#FFFFFF"/>
  <text x="36" y="48" class="title">Weighted ensemble: give rare regions more walkers</text>
  <text x="36" y="83" class="body">Unbiased MD → select walkers within each bin → repeat</text>
  <rect x="1021" y="62" width="143" height="34" rx="17" fill="#F1F5F9"/>
  <text x="1093" y="86" class="note" text-anchor="middle">Schematic</text>

  <rect x="226" y="120" width="473" height="616" rx="18" fill="#EFF7FC" stroke="#BDD6E8" stroke-width="2"/>
  <rect x="719" y="120" width="445" height="616" rx="18" fill="#FFF7ED" stroke="#F2D4AD" stroke-width="2"/>
  <text x="463" y="160" class="region" text-anchor="middle" style="fill:#0072B2">Frequently visited region</text>
  <text x="463" y="191" class="body" text-anchor="middle">Folded-like conformations</text>
  <text x="942" y="160" class="region" text-anchor="middle" style="fill:#B45309">Rarely visited region</text>
  <text x="942" y="191" class="body" text-anchor="middle">More-open conformations</text>

  <text x="36" y="263" class="label">After MD for τ</text>
  <text x="36" y="296" class="note">Each trace:</text>
  <text x="36" y="323" class="note">one walker</text>
  <text x="463" y="227" class="label" text-anchor="middle">3 walkers · probability 0.90</text>
  <text x="942" y="227" class="label" text-anchor="middle">1 walker · probability 0.10</text>

  <!-- Only B and C lie inside the merge selection; A is outside it. -->
  <rect x="382" y="243" width="291" height="151" rx="14" fill="#E1EFF9" stroke="#0072B2" stroke-width="3" stroke-dasharray="8 6"/>
  <g id="we-after-md">
    <g data-walker="A" data-bin="1" data-weight="0.60">
      <text x="298" y="275" class="identity">A</text>
      <use href="#we-folded-a" x="298" y="316" style="color:#0072B2"/>
      <text x="298" y="376" class="weight">w = 0.60</text>
    </g>
    <g data-walker="B" data-bin="1" data-weight="0.20">
      <text x="452" y="275" class="identity">B</text>
      <use href="#we-folded-b" x="452" y="316" style="color:#0072B2"/>
      <text x="452" y="376" class="weight">w = 0.20</text>
    </g>
    <g data-walker="C" data-bin="1" data-weight="0.10">
      <text x="602" y="275" class="identity">C</text>
      <use href="#we-folded-c" x="602" y="316" style="color:#64748B"/>
      <text x="602" y="376" class="weight">w = 0.10</text>
    </g>
    <g data-walker="D" data-bin="2" data-weight="0.10">
      <text x="942" y="275" class="identity">D</text>
      <use href="#we-open-d" x="942" y="316" style="color:#B45309"/>
      <text x="942" y="376" class="weight">w = 0.10</text>
    </g>
  </g>

  <text x="36" y="456" class="label">Resample</text>
  <text x="36" y="488" class="note">Target:</text>
  <text x="36" y="515" class="note">2 walkers / bin</text>

  <path class="flow" d="M298 400 L298 565"/>
  <rect x="243" y="462" width="110" height="34" rx="10" fill="#EFF7FC"/>
  <text x="298" y="486" class="note" text-anchor="middle">Keep A</text>

  <path d="M399 400 L399 417 L657 417 L657 400" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="528" y="450" class="label" text-anchor="middle" style="fill:#0072B2">Merge B + C</text>
  <path class="merge" d="M452 468 L452 565"/>
  <path class="merge" d="M602 468 C602 499 532 518 474 555" stroke-dasharray="7 6"/>
  <path d="M589 473 L613 497 M613 473 L589 497" fill="none" stroke="#64748B" stroke-width="3"/>
  <text x="650" y="518" class="note" text-anchor="middle">C ends</text>

  <text x="942" y="435" class="label" text-anchor="middle" style="fill:#B45309">Split D</text>
  <path class="split" d="M942 452 L942 488 C942 515 843 520 843 565"/>
  <path class="split" d="M942 452 L942 488 C942 515 1041 520 1041 565"/>

  <text x="36" y="598" class="label">Next iteration</text>
  <text x="36" y="631" class="note">Same total weight</text>
  <g id="we-resampled">
    <g data-walker="A" data-parent="A" data-bin="1" data-weight="0.60">
      <text x="298" y="595" class="identity">A</text>
      <use href="#we-folded-a" x="298" y="634" style="color:#0072B2"/>
      <text x="298" y="693" class="weight">w = 0.60</text>
    </g>
    <g data-walker="B" data-parent="B" data-bin="1" data-weight="0.30">
      <text x="452" y="595" class="identity" style="fill:#0072B2">B selected</text>
      <use href="#we-folded-b" x="452" y="634" style="color:#0072B2"/>
      <text x="452" y="693" class="weight">w = 0.30</text>
    </g>
    <g data-walker="D1" data-parent="D" data-bin="2" data-weight="0.05">
      <text x="843" y="595" class="identity">D₁</text>
      <use href="#we-open-d" x="843" y="634" style="color:#B45309"/>
      <text x="843" y="693" class="weight">w = 0.05</text>
    </g>
    <g data-walker="D2" data-parent="D" data-bin="2" data-weight="0.05">
      <text x="1041" y="595" class="identity">D₂</text>
      <use href="#we-open-d" x="1041" y="634" style="color:#B45309"/>
      <text x="1041" y="693" class="weight">w = 0.05</text>
    </g>
  </g>
  <text x="528" y="721" class="note" text-anchor="middle">0.20 + 0.10 → 0.30</text>
  <text x="942" y="721" class="note" text-anchor="middle">Same restart; independent MD seeds</text>

  <text x="463" y="778" class="label" text-anchor="middle" style="fill:#0072B2">2 walkers · probability 0.90</text>
  <text x="942" y="778" class="label" text-anchor="middle" style="fill:#B45309">2 walkers · probability 0.10</text>
  <text x="600" y="829" class="label" text-anchor="middle">More trajectories in the rare region, without increasing its probability.</text>
  <text x="600" y="866" class="body" text-anchor="middle">Merge: choose one parent by weight. Here B survives with probability 2/3.</text>
  <text x="600" y="900" class="note" text-anchor="middle">Total weight = 1 before and after resampling · Conformations and walker target are illustrative.</text>
</svg>
