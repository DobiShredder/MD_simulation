<text x="600" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#243447">MD propagation</text>
<line x1="110" y1="340" x2="1110" y2="340" stroke="#6B7280" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#6B7280">resampling within each bin</text>
<circle cx="405" cy="390" r="22" fill="#E69F00" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="405" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.2</text>
<line x1="425" y1="400" x2="455" y2="445" stroke="#E69F00" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="425" y1="385" x2="455" y2="365" stroke="#E69F00" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="480" cy="365" r="20" fill="#E69F00" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="480" y="371" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.1</text>
<circle cx="480" cy="455" r="20" fill="#E69F00" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="480" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.1</text>
<text x="420" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#E69F00">split</text>
<circle cx="810" cy="365" r="20" fill="#CC79A7" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="810" y="371" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.05</text>
<line x1="835" y1="365" x2="875" y2="400" stroke="#CC79A7" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="810" cy="430" r="20" fill="#CC79A7" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="810" y="436" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.05</text>
<line x1="835" y1="430" x2="875" y2="400" stroke="#CC79A7" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="900" cy="400" r="22" fill="#CC79A7" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="900" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white">0.1</text>
<text x="855" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#CC79A7">merge</text>
<rect x="250" y="575" width="700" height="55" rx="12" fill="#F5F9FC" stroke="#0072B2" stroke-width="2" opacity="1"/>
<text x="600" y="609" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0072B2">Σ walker weights = 1 before and after resampling</text>
<text x="1085" y="520" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#243447">progress coordinate →</text>
</svg>
