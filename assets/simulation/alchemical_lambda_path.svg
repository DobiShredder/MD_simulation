<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Alchemical interaction scaling across lambda states</title>
  <desc>A schematic showing lambda changing Hamiltonian interaction weights from endpoint A to endpoint B, with RBFE and ABFE interpretations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
    </marker>
    <g id="environment">
      <path d="M12 18 C35 3 78 4 94 25 C106 41 101 63 83 72 C66 81 49 73 46 57 C43 43 31 36 12 38 Z"
            fill="#D8B4FE" stroke="#7C3AED" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="60" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">Alchemical path through λ states</text>
  <text x="60" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6573">λ changes the Hamiltonian, not the physical position of the ligand.</text>
  <rect x="1010" y="36" width="130" height="34" rx="17" fill="#EEF2F6" stroke="#9AA7B4"/>
  <text x="1075" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#485563">Schematic</text>

  <line x1="365" y1="282" x2="445" y2="282" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="755" y1="282" x2="835" y2="282" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="405" cy="282" r="6" fill="#FFFFFF" stroke="#243447" stroke-width="2"/>
  <circle cx="795" cy="282" r="6" fill="#FFFFFF" stroke="#243447" stroke-width="2"/>
  <text x="405" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#5B6573">λ ↑</text>
  <text x="795" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#5B6573">λ ↑</text>

  <g transform="translate(60 120)">
    <rect width="305" height="325" rx="18" fill="#FAFCFD" stroke="#B8C4CE" stroke-width="2"/>
    <text x="152.5" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#243447">λ = 0</text>
    <text x="152.5" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6573">endpoint A</text>
    <use href="#environment" x="96" y="95"/>
    <line x1="130" y1="156" x2="154" y2="187" stroke="#0072B2" stroke-width="4"/>
    <line x1="173" y1="153" x2="161" y2="187" stroke="#0072B2" stroke-width="4"/>
    <circle cx="158" cy="202" r="27" fill="#F4C95D" stroke="#9A6700" stroke-width="2"/>
    <text x="158" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#3D3420">A</text>
    <circle cx="221" cy="202" r="22" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="221" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#9D4F7D">B</text>
    <text x="152.5" y="267" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2">A interaction: 1.0</text>
    <text x="152.5" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9D4F7D">B interaction: 0.0</text>
  </g>

  <g transform="translate(447.5 120)">
    <rect width="305" height="325" rx="18" fill="#FAFCFD" stroke="#B8C4CE" stroke-width="2"/>
    <text x="152.5" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#243447">λ = 0.5</text>
    <text x="152.5" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6573">intermediate state</text>
    <use href="#environment" x="96" y="95"/>
    <line x1="130" y1="156" x2="140" y2="187" stroke="#0072B2" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="173" y1="153" x2="201" y2="187" stroke="#CC79A7" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="137" cy="202" r="25" fill="#F4C95D" fill-opacity="0.62" stroke="#9A6700" stroke-width="2"/>
    <text x="137" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#3D3420">A</text>
    <circle cx="202" cy="202" r="25" fill="#CC79A7" fill-opacity="0.62" stroke="#8E3E70" stroke-width="2"/>
    <text x="202" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#3D2334">B</text>
    <text x="152.5" y="267" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#526170">A interaction: 0.5</text>
    <text x="152.5" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#526170">B interaction: 0.5</text>
  </g>

  <g transform="translate(835 120)">
    <rect width="305" height="325" rx="18" fill="#FAFCFD" stroke="#B8C4CE" stroke-width="2"/>
    <text x="152.5" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#243447">λ = 1</text>
    <text x="152.5" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6573">endpoint B</text>
    <use href="#environment" x="96" y="95"/>
    <circle cx="94" cy="202" r="22" fill="#FFFFFF" stroke="#9A6700" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="94" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#7A5A13">A</text>
    <line x1="130" y1="156" x2="161" y2="187" stroke="#CC79A7" stroke-width="4"/>
    <line x1="173" y1="153" x2="168" y2="187" stroke="#CC79A7" stroke-width="4"/>
    <circle cx="165" cy="202" r="27" fill="#CC79A7" stroke="#8E3E70" stroke-width="2"/>
    <text x="165" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#3D2334">B</text>
    <text x="152.5" y="267" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#7A5A13">A interaction: 0.0</text>
    <text x="152.5" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#9D4F7D">B interaction: 1.0</text>
  </g>

  <rect x="60" y="478" width="1080" height="142" rx="16" fill="#F5F8FA" stroke="#B8C4CE" stroke-width="2"/>
  <text x="90" y="515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">One λ coordinate, two uses</text>

  <rect x="90" y="536" width="310" height="58" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="245" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2">RBFE</text>
  <text x="245" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243447">ligand A → ligand B</text>

  <rect x="445" y="536" width="310" height="58" rx="10" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2"/>
  <text x="600" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#9D4F7D">ABFE</text>
  <text x="600" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243447">coupled → decoupled</text>

  <rect x="800" y="526" width="310" height="78" rx="10" fill="#FFFFFF" stroke="#526170" stroke-width="2"/>
  <text x="955" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#243447">Fixed-λ windows</text>
  <text x="955" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526170">neighbor overlap → Σ ΔG</text>

  <text x="600" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">Interaction weights are illustrative; soft-core potentials modify the endpoint scaling form.</text>
</svg>
