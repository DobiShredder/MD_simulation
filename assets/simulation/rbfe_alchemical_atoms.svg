<title>RBFE common core and soft-core atoms</title>
<desc>Schematic of benzene to toluene: the ring carbons and five ring hydrogens are a linearly mixed common core; benzene H1 and the toluene methyl group are soft-core atoms marked with dashed outlines.</desc>
