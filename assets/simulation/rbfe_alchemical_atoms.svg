<text x="60.0" y="88.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">Schematic. Actual masks: scmask1=&#x27;:BNZ@H1&#x27;, scmask2=&#x27;:MBN@C1,H1,H2,H3&#x27;</text>
