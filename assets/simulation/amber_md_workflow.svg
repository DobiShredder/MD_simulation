<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>AMBER system preparation, simulation, and analysis workflow</title>
  <desc>A schematic showing PDB preparation, tleap topology and coordinate generation, pmemd or sander simulation stages, and cpptraj analysis, with antechamber as an optional small-molecule preparation path.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">AMBER MD workflow</text>
  <text x="60" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280">Chignolin tutorial — program and file flow</text>

  <rect x="45" y="110" width="1110" height="390" rx="18" fill="#F8FBFD" stroke="#B8C4CE" stroke-width="2"/>

  <rect x="70" y="145" width="160" height="100" rx="12" fill="#E8F4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="150" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">PDB structure</text>
  <text x="150" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">atom names</text>
  <text x="150" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">initial coordinates</text>

  <line x1="230" y1="195" x2="285" y2="195" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="290" y="145" width="170" height="100" rx="12" fill="#FFF4DA" stroke="#E69F00" stroke-width="2"/>
  <text x="375" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">prepare.py</text>
  <text x="375" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">model / altloc</text>
  <text x="375" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">selection</text>

  <line x1="460" y1="195" x2="515" y2="195" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="520" y="130" width="190" height="130" rx="12" fill="#E9F7F1" stroke="#009E73" stroke-width="2"/>
  <text x="615" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">build.sh / tleap</text>
  <text x="615" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">ff19SB + TIP3P</text>
  <text x="615" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">solvation + ions</text>
  <text x="615" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">topology build</text>

  <line x1="710" y1="170" x2="770" y2="145" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="710" y1="220" x2="770" y2="245" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="775" y="112" width="175" height="90" rx="12" fill="#F2ECF7" stroke="#CC79A7" stroke-width="2"/>
  <text x="862" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">system.parm7</text>
  <text x="862" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">topology + parameters</text>

  <rect x="775" y="215" width="175" height="90" rx="12" fill="#E8F4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="862" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">system.rst7</text>
  <text x="862" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">coordinates + box</text>

  <line x1="950" y1="157" x2="995" y2="205" stroke="#243447" stroke-width="3"/>
  <line x1="950" y1="260" x2="995" y2="215" stroke="#243447" stroke-width="3"/>

  <rect x="995" y="145" width="135" height="130" rx="12" fill="#FDEDE7" stroke="#D55E00" stroke-width="2"/>
  <text x="1062" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#243447">run.sh</text>
  <text x="1062" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">pmemd.cuda</text>
  <text x="1062" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">or sander</text>
  <text x="1062" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">reads mdin</text>

  <rect x="315" y="340" width="570" height="70" rx="12" fill="#FFFFFF" stroke="#243447" stroke-width="2"/>
  <text x="600" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#243447">minimization → heating → equilibration → production</text>
  <text x="600" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">each stage passes its restart file to the next stage</text>
  <line x1="1062" y1="275" x2="880" y2="350" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="930" y="335" width="195" height="100" rx="12" fill="#E8F4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="1027" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#243447">MD output</text>
  <text x="1027" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">production.nc / .rst7</text>
  <text x="1027" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">production.out</text>
  <line x1="885" y1="375" x2="925" y2="375" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="735" y="535" width="250" height="95" rx="12" fill="#E9F7F1" stroke="#009E73" stroke-width="2"/>
  <text x="860" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">cpptraj</text>
  <text x="860" y="598" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">trajectory processing + analysis</text>
  <line x1="1027" y1="435" x2="900" y2="530" stroke="#0072B2" stroke-width="3" marker-end="url(#blue-arrow)"/>

  <rect x="65" y="525" width="535" height="115" rx="12" fill="#FAFAFA" stroke="#6B7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="90" y="558" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#243447">Optional ligand path — not used for Chignolin</text>
  <text x="90" y="586" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">small organic molecule → antechamber → GAFF atom types / partial charges</text>
  <text x="90" y="612" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">parameter files are then loaded by tleap with the protein and solvent</text>
</svg>
