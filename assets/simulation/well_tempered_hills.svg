<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Well-tempered metadynamics reduces the next hill at a biased location</title>
<desc>Three visits to the same collective-variable position show accumulated bias growing while the newly deposited Gaussian hill becomes smaller according to the well-tempered scaling factor.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
  </marker>
  <marker id="orange-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#D55E00"/>
  </marker>
</defs>

<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="55" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">Well-tempered MetaD: more local bias → smaller next hill</text>
<text x="55" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280">Schematic revisits to the same collective-variable position s*</text>

<line x1="392" y1="320" x2="420" y2="320" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="777" y1="320" x2="805" y2="320" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
<text x="406" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#6B7280">revisit</text>
<text x="791" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#6B7280">revisit</text>

<!-- First visit -->
<rect x="45" y="125" width="340" height="405" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="80" cy="162" r="19" fill="#243447"/>
<text x="80" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
<text x="110" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">First visit to s*</text>
<text x="70" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">little accumulated bias</text>
<line x1="75" y1="440" x2="355" y2="440" stroke="#243447" stroke-width="2"/>
<line x1="215" y1="245" x2="215" y2="440" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 6"/>
<text x="215" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#243447">visited position s*</text>
<path d="M85 440 C140 440 165 420 215 420 C265 420 290 440 345 440 L85 440 Z" fill="#B9E0F5" stroke="#0072B2" stroke-width="3"/>
<path d="M120 436 C165 425 180 270 215 270 C250 270 265 425 310 436 C270 432 255 420 215 420 C175 420 160 432 120 436 Z" fill="#F6C37A" stroke="#D55E00" stroke-width="3"/>
<line x1="326" y1="415" x2="326" y2="278" stroke="#D55E00" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
<text x="318" y="348" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D55E00">large</text>
<text x="318" y="366" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D55E00">new hill</text>
<rect x="91" y="486" width="248" height="28" rx="8" fill="#E4F1F8"/>
<text x="215" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0072B2">low V(s*,t) → large w(t)</text>

<!-- Repeated visits -->
<rect x="430" y="125" width="340" height="405" rx="16" fill="#F3F9FC" stroke="#56B4E9" stroke-width="2"/>
<circle cx="465" cy="162" r="19" fill="#0072B2"/>
<text x="465" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
<text x="495" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Repeated visits</text>
<text x="455" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">bias has accumulated at s*</text>
<line x1="460" y1="440" x2="740" y2="440" stroke="#243447" stroke-width="2"/>
<line x1="600" y1="245" x2="600" y2="440" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 6"/>
<text x="600" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#243447">visited position s*</text>
<path d="M470 440 C520 435 550 330 600 330 C650 330 680 435 730 440 L470 440 Z" fill="#8CCBEA" stroke="#0072B2" stroke-width="3"/>
<path d="M505 415 C550 385 570 270 600 270 C630 270 650 385 695 415 C655 375 640 330 600 330 C560 330 545 375 505 415 Z" fill="#F6C37A" stroke="#D55E00" stroke-width="3"/>
<line x1="711" y1="325" x2="711" y2="278" stroke="#D55E00" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
<text x="703" y="295" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D55E00">smaller</text>
<text x="703" y="313" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D55E00">new hill</text>
<rect x="476" y="486" width="248" height="28" rx="8" fill="#DDEFF8"/>
<text x="600" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0072B2">higher V(s*,t) → smaller w(t)</text>

<!-- Later revisit -->
<rect x="815" y="125" width="340" height="405" rx="16" fill="#F8F3FA" stroke="#B58BC4" stroke-width="2"/>
<circle cx="850" cy="162" r="19" fill="#7A5195"/>
<text x="850" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
<text x="880" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Later revisit</text>
<text x="840" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">large local bias tempers deposition</text>
<line x1="845" y1="440" x2="1125" y2="440" stroke="#243447" stroke-width="2"/>
<line x1="985" y1="225" x2="985" y2="440" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 6"/>
<text x="985" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#243447">visited position s*</text>
<path d="M855 440 C905 425 935 265 985 265 C1035 265 1065 425 1115 440 L855 440 Z" fill="#56B4E9" stroke="#0072B2" stroke-width="3"/>
<path d="M890 390 C935 335 955 240 985 240 C1015 240 1035 335 1080 390 C1040 325 1025 265 985 265 C945 265 930 325 890 390 Z" fill="#F6C37A" stroke="#D55E00" stroke-width="3"/>
<line x1="1096" y1="261" x2="1096" y2="242" stroke="#D55E00" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
<text x="1088" y="235" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D55E00">tiny new hill</text>
<rect x="861" y="486" width="248" height="28" rx="8" fill="#EBDDF0"/>
<text x="985" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7A5195">high V(s*,t) → tiny w(t)</text>

<rect x="210" y="558" width="780" height="48" rx="12" fill="#FFF9ED" stroke="#E9B44C" stroke-width="2"/>
<text x="600" y="589" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#243447">w(t) = w<tspan baseline-shift="sub" font-size="14">0</tspan> exp[−V(s(t),t) / (k<tspan baseline-shift="sub" font-size="14">B</tspan> ΔT)]</text>
<text x="600" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280">Blue = accumulated bias · Orange = newly deposited hill · Schematic</text>
</svg>
