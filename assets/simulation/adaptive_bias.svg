<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Metadynamics explained as computational sand</title>
<desc>A walker moves through a collective-variable free-energy landscape and deposits computational sand at visited positions. The accumulated bias fills the sampled basin and lowers the effective barrier for escape.</desc>
<defs>
  <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/>
  </marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/>
  </marker>
  <pattern id="sand" width="22" height="18" patternUnits="userSpaceOnUse">
    <rect width="22" height="18" fill="#F6C56F"/>
    <circle cx="5" cy="5" r="2.3" fill="#D55E00" opacity="0.75"/>
    <circle cx="16" cy="12" r="2" fill="#E69F00" opacity="0.9"/>
  </pattern>
</defs>

<rect width="1200" height="675" fill="#FFFFFF"/>

<text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">Metadynamics as computational sand</text>
<text x="60" y="86" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280">The walker deposits bias at positions already visited in collective-variable space</text>

<!-- Axes -->
<line x1="95" y1="570" x2="1100" y2="570" stroke="#243447" stroke-width="2" marker-end="url(#arrow-dark)"/>
<line x1="95" y1="570" x2="95" y2="125" stroke="#243447" stroke-width="2" marker-end="url(#arrow-dark)"/>
<text x="600" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243447">collective variable s</text>
<text x="36" y="350" text-anchor="middle" transform="rotate(-90 36 350)" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243447">free energy</text>

<!-- Sand accumulated in the visited basin -->
<path d="M110 456 C170 456 190 520 280 520 C390 520 445 230 585 188 L585 302 C515 314 480 348 420 358 C340 371 255 363 190 376 C152 384 130 405 110 418 Z"
      fill="url(#sand)" stroke="none"/>
<path d="M110 418 C150 398 184 382 230 375 C300 364 360 375 420 358 C480 342 515 312 585 302"
      fill="none" stroke="#D55E00" stroke-width="5"/>

<!-- Original landscape -->
<path d="M110 456 C170 456 190 520 280 520 C400 520 440 180 600 180 C760 180 800 520 920 520 C1010 520 1030 456 1090 456"
      fill="none" stroke="#6B7280" stroke-width="5"/>
<text x="785" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280">original free-energy landscape</text>

<!-- Visited positions and deposition -->
<path d="M155 394 C205 360 250 388 300 365 C350 342 390 382 440 350 C468 332 492 326 520 318"
      fill="none" stroke="#243447" stroke-width="3" stroke-dasharray="7 7"/>
<circle cx="185" cy="381" r="7" fill="#FFFFFF" stroke="#243447" stroke-width="3"/>
<circle cx="280" cy="372" r="7" fill="#FFFFFF" stroke="#243447" stroke-width="3"/>
<circle cx="370" cy="365" r="7" fill="#FFFFFF" stroke="#243447" stroke-width="3"/>
<circle cx="455" cy="343" r="7" fill="#FFFFFF" stroke="#243447" stroke-width="3"/>

<circle cx="185" cy="405" r="3.2" fill="#D55E00"/>
<circle cx="180" cy="417" r="3.2" fill="#E69F00"/>
<circle cx="280" cy="397" r="3.2" fill="#D55E00"/>
<circle cx="286" cy="410" r="3.2" fill="#E69F00"/>
<circle cx="370" cy="390" r="3.2" fill="#D55E00"/>
<circle cx="364" cy="403" r="3.2" fill="#E69F00"/>
<circle cx="455" cy="368" r="3.2" fill="#D55E00"/>
<circle cx="461" cy="380" r="3.2" fill="#E69F00"/>

<text x="165" y="285" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#D55E00">drop computational sand</text>
<text x="165" y="313" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243447">at each visited s(t<tspan baseline-shift="sub" font-size="12">i</tspan>)</text>
<line x1="300" y1="320" x2="368" y2="379" stroke="#D55E00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

<!-- Current walker and escape -->
<circle cx="520" cy="310" r="15" fill="#0072B2" stroke="#FFFFFF" stroke-width="4"/>
<text x="500" y="265" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2">walker</text>
<line x1="505" y1="272" x2="515" y2="292" stroke="#0072B2" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

<path d="M535 297 C565 248 590 228 620 236 C680 250 730 350 790 420"
      fill="none" stroke="#0072B2" stroke-width="5" marker-end="url(#arrow-blue)"/>

<!-- Barrier comparison -->
<line x1="640" y1="185" x2="640" y2="301" stroke="#0072B2" stroke-width="3" stroke-dasharray="7 6"/>
<line x1="628" y1="185" x2="652" y2="185" stroke="#0072B2" stroke-width="3"/>
<line x1="628" y1="301" x2="652" y2="301" stroke="#0072B2" stroke-width="3"/>
<text x="675" y="232" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0072B2">lower effective barrier</text>
<text x="675" y="260" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243447">the filled basin is easier to leave</text>

<!-- Minimal legend -->
<rect x="795" y="345" width="255" height="118" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="825" cy="378" r="10" fill="#0072B2"/>
<text x="850" y="385" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243447">current configuration</text>
<rect x="815" y="405" width="20" height="16" fill="url(#sand)" stroke="#D55E00" stroke-width="1"/>
<text x="850" y="420" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243447">accumulated bias</text>
<line x1="815" y1="444" x2="838" y2="444" stroke="#6B7280" stroke-width="4"/>
<text x="850" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243447">unbiased landscape</text>

<text x="600" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">Schematic — bias follows sampling history; it is not spread uniformly over the whole CV space.</text>
</svg>
