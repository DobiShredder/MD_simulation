<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Replica exchange umbrella sampling</title>
<desc>Schematic of neighboring umbrella states exchanging configurations.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker>
<marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#6B7280" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="60" y="52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">Replica exchange umbrella sampling</text>
<text x="60" y="88" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">Same physical temperature, different umbrella centers</text>
<path d="M55 320 Q130 145 205 320" stroke="#0072B2" stroke-width="4" fill="none" opacity="1"/>
<circle cx="130" cy="275" r="17" fill="#0072B2" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="130" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#243447">ξ₀,1</text>
<line x1="175" y1="405" x2="310" y2="405" stroke="#243447" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<path d="M280 320 Q355 145 430 320" stroke="#E69F00" stroke-width="4" fill="none" opacity="1"/>
<circle cx="355" cy="240" r="17" fill="#E69F00" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="355" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#243447">ξ₀,2</text>
<line x1="400" y1="405" x2="535" y2="405" stroke="#243447" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<path d="M505 320 Q580 145 655 320" stroke="#009E73" stroke-width="4" fill="none" opacity="1"/>
<circle cx="580" cy="275" r="17" fill="#009E73" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="580" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#243447">ξ₀,3</text>
<line x1="625" y1="405" x2="760" y2="405" stroke="#243447" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<path d="M730 320 Q805 145 880 320" stroke="#CC79A7" stroke-width="4" fill="none" opacity="1"/>
<circle cx="805" cy="240" r="17" fill="#CC79A7" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="805" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#243447">ξ₀,4</text>
<line x1="850" y1="405" x2="985" y2="405" stroke="#243447" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<path d="M955 320 Q1030 145 1105 320" stroke="#D55E00" stroke-width="4" fill="none" opacity="1"/>
<circle cx="1030" cy="275" r="17" fill="#D55E00" stroke="#243447" stroke-width="2" opacity="1"/>
<text x="1030" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#243447">ξ₀,5</text>
<text x="600" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#243447">exchange adjacent restraint states</text>
<text x="600" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6B7280">Restraints define state identity; walkers carry their coordinates between states.</text>
</svg>
