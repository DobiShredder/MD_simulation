<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Replica exchange through parallel MD and neighboring swap attempts</title>
  <desc>Four fixed temperature lanes show walkers propagating in time. Accepted neighboring exchanges swap walker identities between lanes, while a rejected exchange leaves both walkers at their current temperatures.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="55" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">Replica exchange molecular dynamics</text>
  <text x="55" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280">Schematic — fixed states, moving walkers, and alternating neighbor exchanges</text>

  <rect x="45" y="110" width="1110" height="485" rx="18" fill="#FAFCFD" stroke="#B8C4CE" stroke-width="2"/>
  <text x="250" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">parallel MD</text>
  <text x="545" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">parallel MD</text>
  <text x="840" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">parallel MD</text>

  <line x1="430" y1="135" x2="430" y2="565" stroke="#B8C4CE" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="725" y1="135" x2="725" y2="565" stroke="#B8C4CE" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="430" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">exchange attempt 1</text>
  <text x="725" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7280">exchange attempt 2</text>

  <text x="75" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#D55E00">T4</text>
  <text x="75" y="295" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#E69F00">T3</text>
  <text x="75" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#009E73">T2</text>
  <text x="75" y="505" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0072B2">T1</text>
  <text x="68" y="535" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6B7280">low</text>
  <text x="68" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6B7280">high</text>

  <line x1="120" y1="185" x2="1115" y2="185" stroke="#D55E00" stroke-width="4" opacity="0.75"/>
  <line x1="120" y1="290" x2="1115" y2="290" stroke="#E69F00" stroke-width="4" opacity="0.75"/>
  <line x1="120" y1="395" x2="1115" y2="395" stroke="#009E73" stroke-width="4" opacity="0.75"/>
  <line x1="120" y1="500" x2="1115" y2="500" stroke="#0072B2" stroke-width="4" opacity="0.75"/>

  <line x1="155" y1="185" x2="390" y2="185" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="155" y1="290" x2="390" y2="290" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="155" y1="395" x2="390" y2="395" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="155" y1="500" x2="390" y2="500" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <circle cx="185" cy="185" r="24" fill="#FFFFFF" stroke="#D55E00" stroke-width="3"/><text x="185" y="192" fill="#D55E00">D</text>
    <circle cx="185" cy="290" r="24" fill="#FFFFFF" stroke="#E69F00" stroke-width="3"/><text x="185" y="297" fill="#E69F00">C</text>
    <circle cx="185" cy="395" r="24" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/><text x="185" y="402" fill="#009E73">B</text>
    <circle cx="185" cy="500" r="24" fill="#FFFFFF" stroke="#0072B2" stroke-width="3"/><text x="185" y="507" fill="#0072B2">A</text>
  </g>

  <path d="M395 185 C440 185 455 290 500 290" fill="none" stroke="#D55E00" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M395 290 C440 290 455 185 500 185" fill="none" stroke="#E69F00" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M395 395 C440 395 455 420 500 420" fill="none" stroke="#009E73" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M395 500 C440 500 455 475 500 475" fill="none" stroke="#0072B2" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="460" y1="434" x2="485" y2="459" stroke="#6B7280" stroke-width="4"/>
  <line x1="485" y1="434" x2="460" y2="459" stroke="#6B7280" stroke-width="4"/>

  <rect x="409" y="226" width="82" height="29" rx="6" fill="#F8FBFD"/>
  <text x="450" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#243447">accepted</text>
  <text x="450" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#6B7280">rejected</text>

  <line x1="500" y1="185" x2="685" y2="185" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="500" y1="290" x2="685" y2="290" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="500" y1="395" x2="685" y2="395" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="500" y1="500" x2="685" y2="500" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <circle cx="535" cy="185" r="24" fill="#FFFFFF" stroke="#E69F00" stroke-width="3"/><text x="535" y="192" fill="#E69F00">C</text>
    <circle cx="535" cy="290" r="24" fill="#FFFFFF" stroke="#D55E00" stroke-width="3"/><text x="535" y="297" fill="#D55E00">D</text>
    <circle cx="535" cy="395" r="24" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/><text x="535" y="402" fill="#009E73">B</text>
    <circle cx="535" cy="500" r="24" fill="#FFFFFF" stroke="#0072B2" stroke-width="3"/><text x="535" y="507" fill="#0072B2">A</text>
  </g>

  <path d="M690 290 C735 290 750 395 795 395" fill="none" stroke="#D55E00" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M690 395 C735 395 750 290 795 290" fill="none" stroke="#009E73" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="690" y1="185" x2="795" y2="185" stroke="#E69F00" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="690" y1="500" x2="795" y2="500" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="704" y="331" width="82" height="29" rx="6" fill="#F8FBFD"/>
  <text x="745" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#243447">accepted</text>

  <line x1="795" y1="185" x2="1085" y2="185" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="795" y1="290" x2="1085" y2="290" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="795" y1="395" x2="1085" y2="395" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="795" y1="500" x2="1085" y2="500" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <circle cx="835" cy="185" r="24" fill="#FFFFFF" stroke="#E69F00" stroke-width="3"/><text x="835" y="192" fill="#E69F00">C</text>
    <circle cx="835" cy="290" r="24" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/><text x="835" y="297" fill="#009E73">B</text>
    <circle cx="835" cy="395" r="24" fill="#FFFFFF" stroke="#D55E00" stroke-width="3"/><text x="835" y="402" fill="#D55E00">D</text>
    <circle cx="835" cy="500" r="24" fill="#FFFFFF" stroke="#0072B2" stroke-width="3"/><text x="835" y="507" fill="#0072B2">A</text>
  </g>

  <text x="600" y="635" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243447">State lanes remain fixed; accepted swaps let each walker diffuse through temperature or Hamiltonian space.</text>
</svg>
