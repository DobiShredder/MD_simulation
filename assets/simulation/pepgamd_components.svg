<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Pep-GaMD dual boost</title>
<desc>Component diagram for Pep-GaMD dual boost selective boosts.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker>
<marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#6B7280" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="60" y="52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">Pep-GaMD dual boost</text>
<text x="60" y="88" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">Selected potential components receive separate boost statistics</text>
<rect x="80.0" y="155" width="445.0" height="290" rx="16" fill="#FAFCFD" stroke="#B8C4CE" stroke-width="2" opacity="1"/>
<text x="102.0" y="189" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#243447">Peptide-essential</text>
<path d="M125.0 345 Q320.0 180 480.0 345" stroke="#0072B2" stroke-width="5" fill="none" opacity="1"/>
<line x1="125.0" y1="365" x2="480.0" y2="365" stroke="#0072B2" stroke-width="3" stroke-dasharray="7 6"/>
<text x="305.0" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">selected potential</text>
<rect x="560.0" y="155" width="445.0" height="290" rx="16" fill="#FAFCFD" stroke="#B8C4CE" stroke-width="2" opacity="1"/>
<text x="582.0" y="189" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#243447">Remaining system</text>
<path d="M605.0 345 Q800.0 180 960.0 345" stroke="#E69F00" stroke-width="5" fill="none" opacity="1"/>
<line x1="605.0" y1="365" x2="960.0" y2="365" stroke="#E69F00" stroke-width="3" stroke-dasharray="7 6"/>
<text x="785.0" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">complement</text>
<line x1="200" y1="515" x2="1000" y2="515" stroke="#243447" stroke-width="4" marker-end="url(#arrow)"/>
<text x="600" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#243447">separate statistics → combined accelerated sampling</text>
<text x="600" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#6B7280">Schematic</text>
