<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>OPES Expanded estimates temperature-state weights before calculating a multithermal bias</title>
<desc>A four-step schematic shows potential-energy samples from one walker, evaluation of multithermal states, estimation of their free-energy offsets, and calculation of the expanded-ensemble bias. Unlike OPES METAD, this workflow does not use kernel-density estimation.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#7A5195"/>
  </marker>
</defs>

<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="55" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">OPES_EXPANDED: state weights → multithermal bias</text>
<text x="55" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6B7280">Schematic workflow — one walker at a 300 K thermostat targets states from 300 to 500 K</text>

<line x1="292" y1="310" x2="325" y2="310" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="577" y1="310" x2="610" y2="310" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="862" y1="310" x2="895" y2="310" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Step 1 -->
<rect x="45" y="125" width="245" height="390" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="78" cy="162" r="19" fill="#243447"/>
<text x="78" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
<text x="108" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Collect samples</text>
<text x="70" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">potential energy E(t)</text>
<line x1="70" y1="420" x2="265" y2="420" stroke="#243447" stroke-width="2"/>
<line x1="70" y1="420" x2="70" y2="250" stroke="#243447" stroke-width="2"/>
<path d="M76 400 C92 387 105 365 119 376 C135 389 143 300 160 310 C177 320 184 355 198 340 C215 322 229 270 257 285" fill="none" stroke="#0072B2" stroke-width="4"/>
<circle cx="91" cy="386" r="6" fill="#0072B2"/>
<circle cx="126" cy="372" r="6" fill="#0072B2"/>
<circle cx="160" cy="310" r="6" fill="#0072B2"/>
<circle cx="200" cy="338" r="6" fill="#0072B2"/>
<circle cx="242" cy="285" r="6" fill="#0072B2"/>
<text x="168" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243447">MD steps</text>
<rect x="87" y="468" width="162" height="28" rx="8" fill="#E4F1F8"/>
<text x="168" y="487" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0072B2">one walker</text>

<!-- Step 2 -->
<rect x="330" y="125" width="245" height="390" rx="16" fill="#FFF9ED" stroke="#E9B44C" stroke-width="2"/>
<circle cx="363" cy="162" r="19" fill="#D55E00"/>
<text x="363" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
<text x="393" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Evaluate states</text>
<text x="355" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">ECV_MULTITHERMAL</text>
<line x1="370" y1="420" x2="535" y2="420" stroke="#243447" stroke-width="2"/>
<path d="M375 405 C395 380 408 315 430 305 C452 295 470 345 495 355 C514 363 525 390 533 408" fill="none" stroke="#0072B2" stroke-width="3"/>
<path d="M375 408 C400 390 416 340 440 330 C465 320 485 352 507 370 C520 381 528 397 533 410" fill="none" stroke="#E69F00" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M375 410 C400 400 425 365 452 355 C480 345 508 378 533 412" fill="none" stroke="#7A5195" stroke-width="3" stroke-dasharray="3 6"/>
<line x1="360" y1="238" x2="378" y2="238" stroke="#0072B2" stroke-width="3"/>
<text x="384" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0072B2">300 K</text>
<line x1="430" y1="238" x2="448" y2="238" stroke="#E69F00" stroke-width="3" stroke-dasharray="8 6"/>
<text x="454" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#E69F00">mid</text>
<line x1="489" y1="238" x2="507" y2="238" stroke="#7A5195" stroke-width="3" stroke-dasharray="3 6"/>
<text x="513" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#7A5195">500 K</text>
<text x="452" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243447">temperature states λ(T)</text>
<rect x="374" y="468" width="156" height="28" rx="8" fill="#FCE8D5"/>
<text x="452" y="487" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#D55E00">no KDE</text>

<!-- Step 3 -->
<rect x="615" y="125" width="245" height="390" rx="16" fill="#F1F8FC" stroke="#56B4E9" stroke-width="2"/>
<circle cx="648" cy="162" r="19" fill="#0072B2"/>
<text x="648" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
<text x="678" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Estimate weights</text>
<text x="640" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">state offsets ΔF<tspan baseline-shift="sub" font-size="11">n</tspan>(T)</text>
<line x1="650" y1="420" x2="825" y2="420" stroke="#243447" stroke-width="2"/>
<line x1="650" y1="420" x2="650" y2="250" stroke="#243447" stroke-width="2"/>
<rect x="672" y="330" width="26" height="90" fill="#0072B2"/>
<rect x="710" y="300" width="26" height="120" fill="#56B4E9"/>
<rect x="748" y="270" width="26" height="150" fill="#E69F00"/>
<rect x="786" y="245" width="26" height="175" fill="#7A5195"/>
<text x="685" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#243447">T₁</text>
<text x="723" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#243447">T₂</text>
<text x="761" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#243447">T₃</text>
<text x="799" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#243447">T₄</text>
<rect x="668" y="468" width="139" height="28" rx="8" fill="#DDEFF8"/>
<text x="737" y="487" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0072B2">DELTAFS output</text>

<!-- Step 4 -->
<rect x="900" y="125" width="255" height="390" rx="16" fill="#F8F3FA" stroke="#B58BC4" stroke-width="2"/>
<circle cx="933" cy="162" r="19" fill="#7A5195"/>
<text x="933" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4</text>
<text x="963" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">Calculate bias</text>
<text x="925" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">sample the expanded target</text>
<line x1="925" y1="420" x2="1130" y2="420" stroke="#243447" stroke-width="2"/>
<line x1="925" y1="420" x2="925" y2="250" stroke="#243447" stroke-width="2"/>
<path d="M932 405 C960 395 973 330 997 320 C1021 310 1038 365 1059 350 C1081 335 1095 275 1125 265" fill="none" stroke="#7A5195" stroke-width="5"/>
<text x="1028" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243447">multithermal V<tspan baseline-shift="sub" font-size="11">n</tspan>(E)</text>
<rect x="937" y="468" width="181" height="28" rx="8" fill="#EBDDF0"/>
<text x="1028" y="487" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7A5195">apply to next MD steps</text>

<!-- Feedback loop: the calculated bias changes the next sampling cycle -->
<path d="M1028 525 L1028 565 L168 565 L168 525" fill="none" stroke="#7A5195" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text x="598" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#7A5195">multithermal bias → next sampling cycle</text>
<text x="600" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7280">OPES_EXPANDED estimates state weights ΔF<tspan baseline-shift="sub" font-size="11">n</tspan>(T); it does not use kernel density estimation.</text>
</svg>
