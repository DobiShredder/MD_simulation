<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Molecular features to low-dimensional embeddings</title>
<desc>Pipeline from periodic backbone dihedral angles through sine-cosine features and scaling to PCA, t-SNE, and UMAP projections.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker>
<marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#6B7280" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="60" y="52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">Dimension reduction workflow</text>
<text x="60" y="88" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">The projection is a representation, not a thermodynamic observable</text>
<rect x="70" y="245" width="180" height="125" rx="16" fill="#F5F9FC" stroke="#0072B2" stroke-width="2" opacity="1"/>
<text x="160" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">φ/ψ angles</text>
<text x="160" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">periodic</text>
<rect x="300" y="245" width="180" height="125" rx="16" fill="#F5F9FC" stroke="#0072B2" stroke-width="2" opacity="1"/>
<text x="390" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">sin/cos</text>
<text x="390" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">32 features</text>
<rect x="530" y="245" width="180" height="125" rx="16" fill="#F5F9FC" stroke="#0072B2" stroke-width="2" opacity="1"/>
<text x="620" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#243447">standardize</text>
<text x="620" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">common scale</text>
<line x1="260" y1="307" x2="290" y2="307" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="490" y1="307" x2="520" y2="307" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="800" y="180" width="260" height="82" rx="14" fill="white" stroke="#0072B2" stroke-width="3" opacity="1"/>
<text x="930" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2">PCA</text>
<line x1="710" y1="307" x2="800" y2="221" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="800" y="305" width="260" height="82" rx="14" fill="white" stroke="#E69F00" stroke-width="3" opacity="1"/>
<text x="930" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#E69F00">t-SNE</text>
<line x1="710" y1="307" x2="800" y2="346" stroke="#E69F00" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="800" y="430" width="260" height="82" rx="14" fill="white" stroke="#009E73" stroke-width="3" opacity="1"/>
<text x="930" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#009E73">UMAP</text>
<line x1="710" y1="307" x2="800" y2="471" stroke="#009E73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#243447">Compare structures and parameter sensitivity before interpreting an embedding.</text>
</svg>
