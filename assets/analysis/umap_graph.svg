<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>UMAP neighbor graph and embedding</title>
<desc>Illustrative neighbor graph mapped to a low-dimensional embedding with local graph connectivity emphasized.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker>
<marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#6B7280" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="60" y="52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#243447">UMAP builds and embeds a neighbor graph</text>
<text x="60" y="88" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#6B7280">Illustrative data</text>
<rect x="55" y="130" width="480" height="430" rx="16" fill="#FAFCFD" stroke="#B8C4CE" stroke-width="2" opacity="1"/>
<text x="77" y="164" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#243447">Weighted neighbor graph</text>
<rect x="665" y="130" width="480" height="430" rx="16" fill="#FAFCFD" stroke="#B8C4CE" stroke-width="2" opacity="1"/>
<text x="687" y="164" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#243447">Low-dimensional layout</text>
<line x1="150" y1="250" x2="240" y2="210" stroke="#56B4E9" stroke-width="3"/>
<line x1="240" y1="210" x2="325" y2="270" stroke="#56B4E9" stroke-width="3"/>
