[build]
# Config units: tleap distances and padding Å; salt concentration mM
# Supported pairs: ff99SB-ILDN + TIP3P; ff14SB + TIP3P; ff19SB + OPC
protein_force_field = "ff19SB"
water_model = "OPC"
box_shape = "rectangular"
solute_box_distance = 14.0
disulfide_bonds = []
salt_type = "NaCl"
salt_concentration = 150.0

[run]
# Config units: temperature K; pressure bar; timestep fs (written as AMBER dt in ps)
engine = "pmemd.cuda"
temperature = 300.0
pressure = 1.0
equilibration_ensemble = "NPT"
production_ensemble = "NPT"
timestep = 2.0
constraint_mode = "h-bonds"
minimization_steps = 5000
minimization_steepest_steps = 2500
heating_initial_temperature = 20.0
heating_steps = 250000
equilibration_steps = 500000
production_steps = 10000000
production_segments = 1
trajectory_interval_steps = 5000
energy_interval_steps = 5000
restart_interval_steps = 5000
random_seed = "random"

[umbrella]
# Config unit: distance Å
# Each mask may select one atom or an atom group. A group side uses its center
# of mass in PLUMED (COM), AMBER (igr with ir6=0), and cpptraj seed selection.
# Group atoms must be inside [ratchet_md] whole_molecule_mask.
atom_mask_1 = ":1@CA"
atom_mask_2 = ":10@CA"
windows_file = "us/windows.tsv"
seed_max_error = 0.75
distance_output_interval_steps = 500

[ratchet_md]
# Config units: target distance Å (written to PLUMED in nm); density g/cm^3
whole_molecule_mask = "!:WAT,Na+,Cl-"
target_distance = 30.0
kappa = 100.0
path_generation_steps = 500000
# output_interval_steps sets both ratchet.dat (PLUMED PRINT) and ratchet.nc (ntwx);
# rmd/anal.py picks window seeds from these frames.
output_interval_steps = 500
minimum_density = 0.90
maximum_density = 1.10

# Other AMBER/PLUMED options: [amber.<stage>.<namelist>] and [plumed] tables; see README "Engine option passthrough".
