[build]
# Config units: tleap distances and padding Å; salt concentration mM
# Supported pair with Lipid21: ff19SB + OPC
protein_force_field = "ff19SB"
lipid_force_field = "Lipid21"
water_model = "OPC"
box_shape = "rectangular"
bilayer_composition = "POPC=90,POPE=5,CHOL=5"
popc_bilayer_gro = "inputs/POPC.gro"
pope_bilayer_gro = "inputs/POPE.gro"
cholesterol_bilayer_gro = "inputs/CHOL15.gro"
xy_padding = 20.0
water_padding = 25.0
protein_lipid_distance = 2.0
disulfide_bonds = []
salt_type = "KCl"
salt_concentration = 150.0
# Protein residue selection; Lipid21 splits POPC/POPE into PA/PC/PE/OL.
protein_restraint_mask = "!:WAT,Na+,K+,MG,CA,Cl-,POPC,POPE,CHL,PA,PC,PE,OL"
lipid_restraint_mask = ":PA,PC,PE,OL,CHL"

[run]
# Config units: temperature K; pressure bar; timestep fs (written as AMBER dt in ps)
engine = "pmemd.cuda"
temperature = 300.0
pressure = 1.0
equilibration_ensemble = "NPT"
production_ensemble = "NPT"
pressure_coupling = "anisotropic"
timestep = 2.0
constraint_mode = "h-bonds"
minimization_steps = 10000
minimization_steepest_steps = 5000
heating_initial_temperature = 20.0
heating_steps = 250000
equilibration_steps = 500000
# Heavy-atom and backbone stages; remaining steps are unrestrained.
equilibration_heavy_steps = 200000
equilibration_backbone_steps = 200000
production_steps = 50000000
production_segments = 10
trajectory_interval_steps = 5000
energy_interval_steps = 5000
restart_interval_steps = 5000
random_seed = "random"
