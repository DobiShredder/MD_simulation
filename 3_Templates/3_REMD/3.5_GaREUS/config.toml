[build]
# Config units: tleap distances and padding Å; salt concentration mM
protein_force_field = "ff19SB"
water_model = "OPC"
box_shape = "rectangular"
solute_box_distance = 14.0
disulfide_bonds = []
salt_type = "NaCl"
salt_concentration = 150.0

[run]
# Config units: temperature K; pressure bar; timestep fs (written as AMBER dt in ps)
engine = "pmemd.cuda"
temperature = 300.0
pressure = 1.0
equilibration_ensemble = "NPT"
production_ensemble = "NVT"
timestep = 2.0
constraint_mode = "h-bonds"
minimization_steps = 5000
minimization_steepest_steps = 2500
heating_initial_temperature = 20.0
heating_steps = 250000
equilibration_steps = 500000
production_steps = 100000000
production_segments = 1
trajectory_interval_steps = 5000
energy_interval_steps = 5000
restart_interval_steps = 5000
random_seed = "random"

[umbrella]
# AMBER unit: force constant kcal mol^-1 Å^-2
atom_mask_1 = ":1@CA"
atom_mask_2 = ":10@CA"
windows_file = "windows.tsv"
force_constant = 10.0
exchange_interval_steps = 1000
distance_output_interval_steps = 500

[gamd]
# AMBER unit: sigma0 kcal/mol
reference_replica = 9
conventional_preparation_steps = 200000
conventional_statistics_steps = 1000000
boost_preparation_steps = 200000
boost_statistics_steps = 1000000
averaging_interval_steps = 50000
sigma0 = 6.0

[resources]
openmp_threads_per_replica = 1
gpu_count = 1
