[build]
# Config units: tleap distances and padding Å; salt concentration mM
# Supported pairs: ff99SB-ILDN + TIP3P; ff14SB + TIP3P; ff19SB + OPC
protein_force_field = "ff19SB"
water_model = "OPC"
box_shape = "rectangular"
solute_box_distance = 14.0
disulfide_bonds = []
salt_type = "NaCl"
salt_concentration = 150.0

[run]
# Config units: temperature K; pressure bar; timestep fs (written as AMBER dt in ps)
engine = "pmemd.cuda"
mpi_engine = "pmemd.cuda.MPI"
temperature = 300.0
pressure = 1.0
equilibration_ensemble = "NPT"
# NVT is the standard T-REMD setup: one shared NPT stage fixes the box, then every
# replica runs at that volume. NPT at 1 bar can be unstable for water near 450 K.
production_ensemble = "NVT"
timestep = 2.0
constraint_mode = "h-bonds"
minimization_steps = 5000
minimization_steepest_steps = 2500
heating_initial_temperature = 20.0
heating_steps = 250000
equilibration_steps = 500000
production_steps = 50000000
production_segments = 10
trajectory_interval_steps = 5000
energy_interval_steps = 5000
restart_interval_steps = 5000

[replica_exchange]
# Config unit: temperature K
# "auto" predicts the ladder from the solvated system (minimum/maximum_temperature, target probability).
# "list" uses temperatures as given: increasing, even count, first value = run.temperature.
temperature_mode = "auto"
# Format example only; T-REMD needs a ladder sized for the whole solvated system.
# temperatures = [300.0, 302.5, 305.0, 307.6]
minimum_temperature = 300.0
maximum_temperature = 450.0
target_exchange_probability = 0.20
generator_tolerance = 0.0001
exchange_interval_steps = 1000
random_seed = "random"

# Other AMBER options: [amber.<stage>.<namelist>] tables; see README "Engine option passthrough".
