[build]
# Config units: tleap distances and padding Å; salt concentration mM
# Supported pairs: ff99SB-ILDN + TIP3P; ff14SB + TIP3P; ff19SB + OPC
protein_force_field = "ff19SB"
water_model = "OPC"
box_shape = "rectangular"
solute_box_distance = 14.0
disulfide_bonds = []
salt_type = "NaCl"
salt_concentration = 150.0
tempered_region = "solute"

[run]
# Config units: temperature K; pressure bar; timestep fs (written as GROMACS dt in ps)
equilibration_engine = "gmx"
production_engine = "gmx_mpi"
temperature = 300.0
pressure = 1.0
equilibration_ensemble = "NPT"
production_ensemble = "NPT"
timestep = 2.0
constraint_mode = "h-bonds"
minimization_steps = 5000
# REST has no heating stage, and GROMACS minimization is steepest descent only.
# The shared config checker still requires the next two keys; REST inputs ignore them.
minimization_steepest_steps = 2500
heating_initial_temperature = 20.0
equilibration_steps = 500000
production_steps = 50000000
production_segments = 10
trajectory_interval_steps = 5000
energy_interval_steps = 5000
restart_interval_steps = 5000

[replica_exchange]
# Config unit: temperature K
# "file" reads temperature_file (12 geometric states, 300-450 K by default).
# "auto" predicts the ladder from the tempered-solute atom count; an odd count is raised to
# the next even count by increasing the target probability (range unchanged).
temperature_mode = "file"
minimum_temperature = 300.0
maximum_temperature = 450.0
target_exchange_probability = 0.20
generator_tolerance = 0.0001
exchange_interval_steps = 1000
cpu_threads_per_replica = 1
gpu_count = 1
random_seed = "random"
temperature_file = "inputs/temperatures.txt"

[rest3_kappa]
# Config unit: temperature K
mode = "linear"
onset_temperature = 357.0
maximum_temperature = 450.0
maximum_kappa = 1.020
file = "inputs/kappa.txt"
